# --- winrm_remote_execution
- rule: winrm_remote_execution
  signature: 'ParentImage=wsmprovhost.exe | Image=powershell.exe | Verb=-sta'
  verdict: attack
  technique: T1021.006
  rationale: 'Covenant implant started over PowerShell Remoting; the recording carries no upstream label.'

# --- wmi_event_subscription
- rule: wmi_event_subscription
  signature: 'EventID=19 | Operation=Created'
  verdict: attack
  technique: T1546.003
  rationale: 'WMI event filter and binding created remotely: the recording''s actual behaviour is an event subscription, labelled upstream only with its WMI transport (T1047).'
- rule: wmi_event_subscription
  signature: 'EventID=21 | Operation=Created'
  verdict: attack
  technique: T1546.003
  rationale: 'WMI event filter and binding created remotely: the recording''s actual behaviour is an event subscription, labelled upstream only with its WMI transport (T1047).'

# --- wmi_remote_process_creation
- rule: wmi_remote_process_creation
  signature: 'ParentImage=wmiprvse.exe | Image=powershell.exe | Verb=-noni'
  verdict: attack
  technique: T1546.003
  rationale: 'The WMI event consumer firing and starting the persisted PowerShell payload: the recording''s labelled technique, seen at execution time.'
- rule: wmi_remote_process_creation
  signature: 'ParentImage=wmiprvse.exe | Image=whoami.exe | Verb=-'
  verdict: attack
  technique: T1047
  rationale: 'Command executed remotely through WMI/WSMan automation; the recording carries no upstream label.'

# --- wscript_cscript_execution
- rule: wscript_cscript_execution
  signature: 'ParentImage=monitoringhost.exe | Image=cscript.exe | Verb=/nologo'
  verdict: benign
  rationale: 'Microsoft Monitoring Agent running its management-pack VBScripts. Filtered by parent path.'
- rule: wscript_cscript_execution
  signature: 'ParentImage=netsh.exe | Image=cscript.exe | Verb=<path>'
  verdict: benign
  rationale: 'Built-in Windows network diagnostics script (gatherNetworkInfo.vbs) launched by netsh. Filtered by script path.'
