name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint Python
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Lint Sigma rules (pySigma validators + project checks)
        run: dac lint
      - name: Rule unit tests (synthetic events)
        run: dac test
      - name: Test suite (miniature recordings, no dataset download)
        run: pytest --cov --cov-report=term-missing
      - name: Convert every rule (Splunk SPL, Elastic Lucene / ES|QL, Microsoft KQL)
        run: dac convert -o reports/queries
      - name: ATT&CK Navigator coverage layer
        run: dac coverage -o reports/attack_navigator_layer.json
      - name: Upload converted queries
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: siem-queries
          path: reports/queries/
