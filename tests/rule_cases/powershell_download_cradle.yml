rule: powershell_download_cradle
defaults:
  Channel: Microsoft-Windows-PowerShell/Operational
  EventID: 4104
cases:
- name: download and in-memory invocation
  match: true
  event:
    ScriptBlockText: x DownloadString x IEX x
- name: download only
  match: false
  event:
    ScriptBlockText: x DownloadFile x
- name: invocation only
  match: false
  event:
    ScriptBlockText: x Invoke-Expression x
