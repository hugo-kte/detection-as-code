rule: wmi_remote_process_creation
defaults:
  Channel: Microsoft-Windows-Sysmon/Operational
  EventID: 1
cases:
- name: shell started by the WMI provider host
  match: true
  event:
    ParentImage: C:\Windows\System32\wbem\WmiPrvSE.exe
    Image: C:\Windows\System32\cmd.exe
- name: other child of the WMI provider host
  match: false
  event:
    ParentImage: C:\Windows\System32\wbem\WmiPrvSE.exe
    Image: C:\Program Files\Example\agent.exe
- name: native process-creation audit (4688) uses the field aliases
  match: true
  event:
    Channel: Security
    EventID: 4688
    ParentProcessName: C:\Windows\System32\wbem\WmiPrvSE.exe
    NewProcessName: C:\Windows\System32\cmd.exe
