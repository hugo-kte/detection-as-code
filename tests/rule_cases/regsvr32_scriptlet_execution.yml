rule: regsvr32_scriptlet_execution
defaults:
  Channel: Microsoft-Windows-Sysmon/Operational
  EventID: 1
cases:
- name: scriptlet handler
  match: true
  event:
    Image: C:\Windows\System32\regsvr32.exe
    CommandLine: x scrobj x
- name: plain DLL registration
  match: false
  event:
    Image: C:\Windows\System32\regsvr32.exe
    CommandLine: x example.dll
