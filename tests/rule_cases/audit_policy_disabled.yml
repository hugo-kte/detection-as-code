rule: audit_policy_disabled
defaults:
  Channel: Microsoft-Windows-Sysmon/Operational
  EventID: 1
cases:
- name: success auditing disabled
  match: true
  event:
    Image: C:\Windows\System32\auditpol.exe
    CommandLine: x /success:disable
- name: policy displayed
  match: false
  event:
    Image: C:\Windows\System32\auditpol.exe
    CommandLine: x /get x
