rule: webshell_server_process_spawn
defaults:
  Channel: Microsoft-Windows-Sysmon/Operational
  EventID: 1
cases:
- name: web worker starts a shell
  match: true
  event:
    ParentImage: C:\Windows\System32\inetsrv\w3wp.exe
    Image: C:\Windows\System32\cmd.exe
- name: web worker starts a compiler helper
  match: false
  event:
    ParentImage: C:\Windows\System32\inetsrv\w3wp.exe
    Image: C:\Windows\Microsoft.NET\csc.exe
