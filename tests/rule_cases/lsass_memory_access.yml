rule: lsass_memory_access
defaults:
  Channel: Microsoft-Windows-Sysmon/Operational
  EventID: 10
  TargetImage: C:\Windows\System32\lsass.exe
cases:
- name: dump-capable rights from an unknown process
  match: true
  event:
    SourceImage: C:\Temp\example.exe
    GrantedAccess: '0x1410'
- name: query-only rights are not enough
  match: false
  event:
    SourceImage: C:\Temp\example.exe
    GrantedAccess: '0x1400'
- name: session manager at boot is filtered
  match: false
  event:
    SourceImage: C:\Windows\System32\csrss.exe
    GrantedAccess: '0x1fffff'
- name: WMI process query is filtered
  match: false
  event:
    SourceImage: C:\Windows\System32\wbem\WmiPrvSE.exe
    GrantedAccess: '0x1410'
- name: other WMI access rights still alert
  match: true
  event:
    SourceImage: C:\Windows\System32\wbem\WmiPrvSE.exe
    GrantedAccess: '0x1fffff'
- name: another target process
  match: false
  event:
    SourceImage: C:\Temp\example.exe
    TargetImage: C:\Windows\System32\notepad.exe
    GrantedAccess: '0x1410'
- name: Azure guest agent log collector is filtered
  match: false
  event:
    SourceImage: C:\WindowsAzure\GuestAgent_x\CollectGuestLogs.exe
    GrantedAccess: '0x1410'
