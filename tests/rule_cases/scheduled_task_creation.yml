rule: scheduled_task_creation
defaults:
  Channel: Security
  EventID: 4698
cases:
- name: task registered by a user
  match: true
  event:
    TaskName: \Example
    SubjectUserName: example-user
- name: built-in task maintained by the computer account
  match: false
  event:
    EventID: 4702
    TaskName: \Microsoft\Windows\Example\Task
    SubjectUserName: EXAMPLE-PC$
- name: built-in path used by a user still alerts
  match: true
  event:
    TaskName: \Microsoft\Windows\Example\Task
    SubjectUserName: example-user
- name: OneDrive's per-user updater task is filtered
  match: false
  event:
    TaskName: \OneDrive Standalone Update Task-S-1-5-21-1-2-3-1001
    TaskContent: <Exec><Command>%localappdata%\Microsoft\OneDrive\OneDriveStandaloneUpdater.exe</Command></Exec>
    SubjectUserName: example-user
- name: a task named like OneDrive's updater but running another program still alerts
  match: true
  event:
    TaskName: \OneDrive Standalone Update Task-S-1-5-21-1-2-3-1001
    TaskContent: <Exec><Command>C:\Users\Public\example.exe</Command></Exec>
    SubjectUserName: example-user
- name: other security event
  match: false
  event:
    EventID: 4624
    TaskName: \Example
