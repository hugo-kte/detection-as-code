rule: cmstp_proxy_execution
defaults:
  Channel: Microsoft-Windows-Sysmon/Operational
  EventID: 1
cases:
- name: silent flag
  match: true
  event:
    Image: C:\Windows\System32\cmstp.exe
    CommandLine: x /s x
- name: other binary with the same flag
  match: false
  event:
    Image: C:\Windows\System32\notepad.exe
    CommandLine: x /s x
