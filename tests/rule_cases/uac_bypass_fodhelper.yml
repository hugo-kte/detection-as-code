rule: uac_bypass_fodhelper
defaults:
  Channel: Microsoft-Windows-Sysmon/Operational
  EventID: 13
cases:
- name: handler key written
  match: true
  event:
    TargetObject: HKU\S-1-5-21-1-2-3-1001_Classes\ms-settings\Shell\Open\command\(Default)
- name: other class key
  match: false
  event:
    TargetObject: HKU\S-1-5-21-1-2-3-1001_Classes\Example\Shell\Open\command
