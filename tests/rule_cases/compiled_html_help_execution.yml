rule: compiled_html_help_execution
defaults:
  Channel: Microsoft-Windows-Sysmon/Operational
  EventID: 1
cases:
- name: help file opened
  match: true
  event:
    Image: C:\Windows\hh.exe
    CommandLine: x C:\Temp\x.chm
- name: no help file
  match: false
  event:
    Image: C:\Windows\hh.exe
    CommandLine: x
