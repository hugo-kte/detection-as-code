rule: account_discovery_net
defaults:
  Channel: Microsoft-Windows-Sysmon/Operational
  EventID: 1
cases:
- name: account enumeration
  match: true
  event:
    Image: C:\Windows\System32\net1.exe
    CommandLine: net1 user
- name: unrelated net verb
  match: false
  event:
    Image: C:\Windows\System32\net.exe
    CommandLine: net time
