title: Command Shell Spawned by a DCOM Server
id: 1854c62f-57ae-4a29-954b-54777cc77413
status: experimental
description: |
    Detects a command interpreter or script host launched as a child of a DCOM/COM server that is
    frequently abused for remote execution (MMC, Office applications, the ShellWindows/ShellBrowser
    broker). This parent/child shape is the generic footprint of DCOM-based lateral movement.
references:
    - https://attack.mitre.org/techniques/T1021/003/
author: Hugo
date: 2026-10-13
tags:
    - attack.t1021.003
    - attack.lateral-movement
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith:
            - '\mmc.exe'
            - '\excel.exe'
            - '\winword.exe'
            - '\powerpnt.exe'
            - '\outlook.exe'
            - '\explorer.exe'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'
            - '\mshta.exe'
    filter_interactive_shell:
        CommandLine|re|i: '^"?([a-z]:\\[^"]*\\)?(cmd|powershell|pwsh)(\.exe)?"?\s*$'
    condition: selection and not filter_interactive_shell
falsepositives:
    - Office applications spawn shells when users run macros; correlate with document activity and the
      command line.
level: medium
