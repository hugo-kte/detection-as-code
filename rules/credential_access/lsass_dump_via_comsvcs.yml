title: LSASS Memory Dump via comsvcs.dll MiniDump
id: 0e167cb7-a0c9-4404-82d9-cacdac5e8036
status: experimental
description: |
    Detects use of the built-in comsvcs.dll MiniDump export, invoked through a signed host binary, to
    write the memory of a process (typically LSASS) to disk. This living-off-the-land technique needs
    no external tool, so the detection keys on the MiniDump export name together with the loader
    rather than on any particular utility.
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: Hugo
date: 2026-10-13
tags:
    - attack.t1003.001
    - attack.credential-access
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains|all:
            - 'comsvcs'
            - 'MiniDump'
    condition: selection
falsepositives:
    - Legitimate troubleshooting that dumps process memory with comsvcs.dll is rare and should be
      confirmed with the operator.
level: high
