title: SAM/SECURITY/SYSTEM Registry Hive Dump
id: d9034ce5-66ef-4b8b-b7b4-b6bf0aa8b832
status: experimental
description: |
    Detects attempts to copy the SAM, SECURITY or SYSTEM registry hives, which together yield local
    password hashes and LSA secrets. It covers the two generic mechanisms used to read the locked
    hives: saving them with reg.exe and copying them out of a volume shadow copy with esentutl. The
    rule is written around the hive names and the copy verbs, not a specific tool.
references:
    - https://attack.mitre.org/techniques/T1003/002/
    - https://attack.mitre.org/techniques/T1003/004/
author: Hugo
date: 2026-10-13
tags:
    - attack.t1003.002
    - attack.t1003.004
    - attack.credential-access
logsource:
    category: process_creation
    product: windows
detection:
    reg_image:
        Image|endswith: '\reg.exe'
    reg_verb:
        CommandLine|contains:
            - ' save '
            - ' export '
    reg_secret_hives:  # every key under SAM and SECURITY is credential material
        CommandLine|contains:
            - 'hklm\sam'
            - 'hklm\security'
            - 'hkey_local_machine\sam'
            - 'hkey_local_machine\security'
    reg_system_hive:  # SYSTEM is mostly configuration: only the whole hive (boot key) counts
        CommandLine|re|i: '(hklm|hkey_local_machine)\\system("|\s|$)'
    esentutl_copy:
        Image|endswith: '\esentutl.exe'
        CommandLine|contains|all:
            - '/y'
            - 'sam'
    condition: (reg_image and reg_verb and (reg_secret_hives or reg_system_hive)) or esentutl_copy
falsepositives:
    - Backup or migration tooling that exports registry hives; correlate with the account and host.
level: high
