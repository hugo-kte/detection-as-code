title: Logon Script Registered via UserInitMprLogonScript
id: 1627e050-b881-4133-a681-6c778816a039
status: experimental
description: |
    Detects a value being written to the Environment\UserInitMprLogonScript registry entry, an
    uncommon per-user logon-script hook that runs a program at every logon. It is rarely used
    legitimately and is a quiet persistence location.
references:
    - https://attack.mitre.org/techniques/T1037/001/
author: Hugo
date: 2026-10-13
tags:
    - attack.t1037.001
    - attack.persistence
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith: '\Environment\UserInitMprLogonScript'
    condition: selection
falsepositives:
    - Essentially none on modern systems; investigate every hit.
level: high
