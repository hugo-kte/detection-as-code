title: Logging Service Disabled via PowerShell Service Cmdlet
id: 2b7d9c14-8e3a-4c77-9f2b-3a1c6e9d4f22
status: experimental
description: |
    Detects PowerShell stopping or disabling the Windows Event Log service, Sysmon or another
    security service, including disabling netprofm, a service that depends on the Event Log, as the
    first step of stopping it. Turning off the logging service blinds host-based detection. Requires
    script-block logging.
references:
    - https://attack.mitre.org/techniques/T1562/002/
author: Hugo
date: 2026-10-13
tags:
    - attack.t1562.002
    - attack.defense-evasion
logsource:
    product: windows
    category: ps_script
detection:
    verb:
        ScriptBlockText|contains:
            - 'Stop-Service'
            - 'Set-Service'
            - 'Suspend-Service'
    target:
        ScriptBlockText|contains:
            - 'EventLog'
            - 'Windows Event Log'
            - 'Sysmon'
            - 'netprofm'
            - 'WinDefend'
            - 'SecurityHealthService'
    condition: verb and target
falsepositives:
    - Maintenance scripts that cycle these services; correlate with the operator and change windows.
level: high
