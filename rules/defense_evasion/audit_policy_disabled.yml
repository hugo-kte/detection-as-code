title: Audit Policy Disabled via auditpol
id: 4d9f2b36-a05c-4e99-b124-5c3e8f1a6b44
status: experimental
description: |
    Detects auditpol being used to turn off success or failure auditing or to remove a per-user audit
    policy. Disabling audit subcategories stops the Security log from recording the matching events,
    blinding downstream detection.
references:
    - https://attack.mitre.org/techniques/T1562/002/
author: Hugo
date: 2026-10-13
tags:
    - attack.t1562.002
    - attack.defense-evasion
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\auditpol.exe'
        CommandLine|contains:
            - '/success:disable'
            - '/failure:disable'
            - '/remove'
            - 'clear'
    condition: selection
falsepositives:
    - Deliberate audit-policy changes by administrators; correlate with change management.
level: high
